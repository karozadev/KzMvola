<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>KzMvola — gabarit des icônes PWA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet" />
<style>
  /*
   * Source des icônes de public/ (générées par capture Chromium).
   * ?mask=1  -> variante maskable (glyphe réduit dans la zone de sécurité).
   * Voir docs/README.md pour les commandes de régénération.
   */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #e50914;
    font-family: 'Archivo Black', system-ui, sans-serif;
  }
  .glyph {
    color: #ffffff;
    font-size: 50vmin;
    line-height: 1;
    letter-spacing: -0.04em;
    transform: translateY(0.04em);
  }
  body.mask .glyph { font-size: 37vmin; }
</style>
</head>
<body>
  <span class="glyph">Kz</span>
  <script>
    if (new URLSearchParams(location.search).has('mask')) document.body.classList.add('mask');
  </script>
</body>
</html>
