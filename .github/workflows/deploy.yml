name: Build, push and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name (ghcr.io/<owner>/<repo> en minuscules)
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Secrets à créer dans Settings > Secrets and variables > Actions :
      #   VPS_HOST         adresse IP ou domaine du VPS
      #   VPS_USER         utilisateur SSH utilisé pour le déploiement
      #   VPS_SSH_KEY      clé privée SSH encodée en base64
      #                    (ex: base64 -w0 ~/.ssh/id_ed25519) correspondant
      #                    à une clé publique autorisée sur le VPS
      #   VPS_PORT         port SSH du VPS (optionnel, 22 par défaut)
      #   VPS_DEPLOY_PATH  dossier absolu sur le VPS où déposer
      #                    kzmvola-compose.yml (ex: /home/deployer, partagé
      #                    avec d'autres projets — nom de fichier dédié pour
      #                    ne pas écraser leur docker-compose.yml)
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode SSH key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Copy kzmvola-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: /tmp/deploy_key
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy/kzmvola-compose.yml"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 1

      - name: Pull and restart container on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: /tmp/deploy_key
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GH_ACTOR,GH_TOKEN,DEPLOY_PATH
          script: |
            set -e
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            cd "$DEPLOY_PATH"
            docker compose -f kzmvola-compose.yml pull
            docker compose -f kzmvola-compose.yml up -d
            docker image prune -f

      - name: Remove decoded SSH key
        if: always()
        run: rm -f /tmp/deploy_key
